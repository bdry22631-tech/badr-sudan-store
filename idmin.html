<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - Badr Sudan</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .admin-card { background: var(--card-bg); padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: var(--accent-color); margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--text-secondary); font-size: 0.9rem; }
        input, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: var(--text-color); outline: none; }
        input:focus, textarea:focus { border-color: var(--accent-color); }
        button { width: 100%; padding: 12px; background: var(--accent-color); color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        button:hover { background: #0ea5e9; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: var(--accent-color); }
        #status { text-align: center; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>رفع تطبيق جديد</h2>
        <form id="uploadForm">
            <div class="form-group">
                <label>اسم التطبيق</label>
                <input type="text" id="appName" required placeholder="مثال: تطبيق القران الكريم">
            </div>
            <div class="form-group">
                <label>وصف التطبيق</label>
                <textarea id="appDesc" rows="3" required placeholder="اكتب نبذة مختصرة عن التطبيق..."></textarea>
            </div>
            <div class="form-group">
                <label>رابط تحميل ملف APK</label>
                <input type="url" id="appLink" required placeholder="https://example.com/app.apk">
            </div>
            <div class="form-group">
                <label>رقم الإصدار</label>
                <input type="text" id="appVersion" value="1.0">
            </div>
            <button type="submit" id="submitBtn">نشر في المتجر</button>
        </form>
        <p id="status"></p>
        <a href="index.html" class="back-link">العودة إلى المتجر الرئيسي</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');
            
            btn.innerText = "جاري النشر...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "apps"), {
                    name: document.getElementById('appName').value,
                    description: document.getElementById('appDesc').value,
                    link: document.getElementById('appLink').value,
                    version: document.getElementById('appVersion').value,
                    createdAt: new Date()
                });

                status.style.color = "#38bdf8";
                status.innerText = "تم رفع التطبيق ونشره بنجاح!";
                document.getElementById('uploadForm').reset();
            } catch (error) {
                status.style.color = "#ef4444";
                status.innerText = "حدث خطأ أثناء الرفع، تأكد من إعدادات قاعدة البيانات.";
            } finally {
                btn.innerText = "نشر في المتجر";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
